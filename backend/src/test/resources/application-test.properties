# H2 em memória (isolado do PostgreSQL de dev)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# === JWT (apenas para testes) ===
# Secret fixo de teste — isolado do secret de produção.
# Deve ser Base64 válido (o JwtService faz Decoders.BASE64.decode direto).
# Valor abaixo decodifica para "test-secret-key-at-least-32-bytes" (42 bytes = 336 bits).
jwt.secret=dGVzdC1zZWNyZXQta2V5LWF0LWxlYXN0LTMyLWJ5dGVz

# Expirações curtas para testes (mesmos valores de produção, ok)
jwt.expiration=3600000
jwt.refresh-expiration=604800000