# === SERVIDOR ===
server.port=8080

# === PROFILE ATIVO ===
# Padrão: postgres (persistente)
# Para dev rápido em memória: SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=${SPRING_PROFILES_ACTIVE:postgres}

# === JWT ===
jwt.secret=${JWT_SECRET}
jwt.expiration=3600000
jwt.refresh-expiration=604800000

# === UPLOAD (futuro) ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================================
# OBSERVABILIDADE — Actuator
# ============================================================

# Expõe apenas endpoints seguros por padrão.
# /actuator/prometheus é adicionado abaixo — necessário para o Prometheus.
management.endpoints.web.exposure.include=health,info,metrics,prometheus

# Detalhes do health: "never" (só UP/DOWN), "when-authorized", "always".
# Em produção, "when-authorized" é o padrão seguro. Em dev, "always" ajuda
# a diagnosticar. Aqui deixamos "when-authorized" e liberamos em dev via
# application-dev.properties.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.show-components=when-authorized

# Health probes para Kubernetes/Docker
management.endpoint.health.probes.enabled=true

# Métricas comuns (http.server.requests, jvm.memory.used, hikaricp.connections, etc.)
# já são registradas automaticamente. Aqui só ativamos histogramas para latência
# percentil — útil para dashboards de SLA.
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.slo.http.server.requests=50ms,100ms,500ms,1s,5s

# Info: expor dados do projeto (versão, nome)
management.info.env.enabled=true
management.info.java.enabled=true
management.info.os.enabled=true

# Tag de aplicação nas métricas — facilita agregação no Prometheus
management.metrics.tags.application=meufreela-api

# ============================================================
# INFO — visível em /actuator/info
# ============================================================

info.app.name=MeuFreela API
info.app.description=Marketplace que conecta clientes a freelancers
info.app.version=0.0.1-SNAPSHOT
info.app.java-version=${java.version}