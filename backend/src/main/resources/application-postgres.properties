# === POSTGRESQL (produção / persistente / Docker) ===
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/meufreela}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:meufreela}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:meufreela123}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# MUDANÇA CRÍTICA: trocar "update" por "validate".
# - "update": Hibernate pode alterar schema (o que víamos antes)
# - "validate": Hibernate apenas VERIFICA se o schema bate com as entidades.
#   Se não bater, falha o startup — isso é bom, evita schema drift.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway — migrations versionadas
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
# baseline-version: marca a V1 como aplicada em bancos existentes
# (a V1 documenta o estado inicial; se o banco já existe, marcamos como aplicada)
spring.flyway.baseline-version=1
# validate-on-migrate: verifica checksums das migrations já aplicadas
spring.flyway.validate-on-migrate=true
spring.flyway.table=flyway_schema_history

# Health — expor status do Flyway no Actuator
management.health.flyway.enabled=true

# Testes manuais com Postgres local
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always