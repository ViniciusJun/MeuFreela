# === H2 (dev rápido, em memória) ===
spring.datasource.url=jdbc:h2:mem:meufreeladb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Em dev, expor detalhes do health (database, disk, etc.)
management.endpoint.health.show-details=always
management.endpoint.health.show-components=always

# Flyway desabilitado em dev (H2 em memória recriado a cada boot)
spring.flyway.enabled=false

# Manter ddl-auto=update em dev (schema regenerado do zero)
spring.jpa.hibernate.ddl-auto=update