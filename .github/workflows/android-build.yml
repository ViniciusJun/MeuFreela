name: Android Build & Tests

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '**/build.gradle'
      - 'gradle/**'
      - '.github/workflows/android-build.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'app/**'
      - '**/build.gradle'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do código
        uses: actions/checkout@v5

      - name: Configurar JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar cache do Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Dar permissão de execução ao gradlew
        run: chmod +x ./gradlew

      - name: Preparar google-services.json
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" ]; then
            echo "Usando google-services.json do repositório de secrets"
            echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 -d > app/google-services.json
          else
            echo "Secret não configurado — usando fixture dummy para validação de build"
            cp .github/fixtures/google-services.json app/google-services.json
          fi

      - name: Rodar testes unitários
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Compilar APK de debug
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Publicar relatório de testes
        if: always() # Garante o upload mesmo se os testes falharem
        uses: actions/upload-artifact@v5
        with:
          name: android-test-reports
          path: app/build/reports/tests/** # Captura todos os subdiretórios
          retention-days: 7

      - name: Publicar APK de debug
        if: success()
        uses: actions/upload-artifact@v5
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 7