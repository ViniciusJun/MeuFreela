# === SERVIDOR ===
server.port=8080

# === PROFILE ATIVO ===
# Padrão: postgres (persistente)
# Para dev rápido em memória: SPRING_PROFILES_ACTIVE=dev
spring.profiles.active=postgres

# === JWT ===
jwt.secret=MinhaChaveSuperSecretaParaJWTComPeloMenos256BitsDeComprimento!
jwt.expiration=86400000
jwt.refresh-expiration=604800000

# === UPLOAD (futuro) ===
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB