spring.application.name=meufreela-api

# Servidor
server.port=8080

# Banco H2 em memória
spring.datasource.url=jdbc:h2:mem:meufreeladb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Console do H2 (acessível em http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JWT (em produção, use variável de ambiente!)
jwt.secret=MinhaChaveSuperSecretaParaJWTComPeloMenos256BitsDeComprimento!
jwt.expiration=86400000
jwt.refresh-expiration=604800000