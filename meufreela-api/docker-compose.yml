version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: meufreela-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: meufreela
      POSTGRES_USER: meufreela
      POSTGRES_PASSWORD: meufreela123
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - meufreela_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U meufreela -d meufreela"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  meufreela_pgdata:
    driver: local